<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Create simple, calming sounds in your browser.">
    <title>{% block title %}Sound Foundry{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg" aria-label="Main navigation">
      <div class="container py-2">
        <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('index') }}">
          <span class="brand-mark" aria-hidden="true">∿</span>
          <span>Sound Foundry</span>
        </a>
        <span class="navbar-text d-none d-sm-inline">Focus. Rest. Create.</span>
      </div>
    </nav>

    <main>{% block content %}{% endblock %}</main>

    <footer class="container py-4 text-center text-secondary small">
      Sound generated locally in your browser.
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Binaural Beat Generator</title>
</head>
<body>
  <h1>Binaural Beat Generator</h1>

  <label for="baseFrequency">Base frequency:</label>
  <input
    id="baseFrequency"
    type="number"
    value="200"
    min="20"
    max="1000"
  />
  Hz

  <br /><br />

  <label for="beatFrequency">Beat frequency:</label>
  <input
    id="beatFrequency"
    type="number"
    value="10"
    min="0.1"
    max="40"
    step="0.1"
  />
  Hz

  <br /><br />

  <label for="volume">Volume:</label>
  <input
    id="volume"
    type="range"
    min="0"
    max="0.2"
    value="0.05"
    step="0.01"
  />

  <br /><br />

  <button id="startButton" type="button">Start</button>
  <button id="stopButton" type="button" disabled>Stop</button>

  <p id="status">Stopped</p>

  <script src="{{ url_for('static', filename='js/binaural-beats.js') }}"></script>

</body>
</html>
